services:
  bot:
    build: .
    container_name: hosting_bot
    command: python -m app.main
    env_file: .env
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    volumes:
      - ./app:/code/app
      # bot deploy করার সময় Docker SDK ব্যবহারের জন্য (Phase 4-এ লাগবে)
      - /var/run/docker.sock:/var/run/docker.sock

  mongo:
    image: mongo:7
    container_name: hosting_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    container_name: hosting_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mongo_data:
